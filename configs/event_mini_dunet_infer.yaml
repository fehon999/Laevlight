# Keep data and model settings consistent with event_mini_dunet_train.yaml.
seed: 42
device: auto

data:
  name: eglol
  root: "/home/user/Datasets/SDE/SDE_dataset/sdeindoor_test"
  train_split: train
  query_split: validate
  test_split: test
  voxel_grid_channel: 32
  # Crop size: EvLight also evaluates a central 256x256 crop.
  img_height: 256
  img_width: 256
  is_split_event: true
  reference_first_probability: 0.3
  reference_dropout_probability: 0.1

loader:
  batch_size: 1
  num_workers: 8
  drop_last: false

model:
  IlluNet:
    base_chs: 48
    illumination_set: [0]
  ImageNet:
    snr_factor: 3
    voxel_grid_channel: 32
    base_chs: 48
    snr_threshold_list: [0.6, 0.5, 0.4]
  ReferenceBranch:
    enabled: true
    encoder_blocks: 2
    fusion_mode: reference_affine
    residual_scale: 0.1
    statistics_eps: 0.000001
    zero_init: true
  name: MiniEventDUNet
  event_channels: 32

inference:
  amp: true
  checkpoint: outputs/event_mini_dunet_affine_ssim/best.pt
  split: test
  output_dir: outputs/event_mini_dunet_affine_ssim_infer
  save_gt: false
  strict: true
  # Print running means over valid reference frames; 0 prints only the final mean.
  print_reference_diagnostics: true
  reference_diagnostics_interval: 100
