seed: 42
device: auto
output_dir: outputs/event_mini_dunet_task

finetune:
  # You can also pass this from the command line with --checkpoint.
  init_checkpoint: "/home/user/dufeihan/evlight_refer/outputs/event_mini_dunet_global/global_last.pt"
  # false allows an EvLight-only checkpoint to initialize the augmented model;
  # only the new reference_branch.* keys are then missing.
  init_strict: false
  # Task adaptation keeps omega/reference frame_encoder fixed and resets theta:
  # EvLight + current_encoder + statistics gate + linear fusion.
  reset_recovery: true

data:
  name: get_eglol_withNE_dataset
  root: "/home/user/Datasets/SDE/SDE_Dataset/SDE_dataset/SDE_indoor/sde_in_release/sde_in_meta"
  train_split: train
  query_split: validate
  test_split: test
  voxel_grid_channel: 32
  img_height: 256
  img_width: 256
  is_split_event: true
  reference_first_probability: 0.1
  reference_dropout_probability: 0.1
  geometric_augmentation: true

loader:
  batch_size: 8
  num_workers: 4
  drop_last: true

model:
  IlluNet:
    base_chs: 48
    illumination_set: [0]
  ImageNet:
    snr_factor: 3
    voxel_grid_channel: 32
    base_chs: 48
    snr_threshold_list: [ 0.6, 0.5 ]
  ReferenceBranch:
    enabled: true
    encoder_blocks: 2
    fusion_mode: latent_stats
    residual_scale: 0.1
    statistics_eps: 0.000001
    zero_init: true
  name: MiniEventDUNet
  event_channels: 32

loss:
  # Fine-tuning freezes omega/reference encoder and optimizes all theta with Phi.
  charbonnier_weight: 1.0
  lpips_weight: 0.5
  charbonnier_eps: 0.0001
  lpips_net: alex
  omega_gamma: 1.0

train:
  amp: true
  weight_decay: 0.0003
  adaptation:
    epochs: 10
    lr: 0.0001
